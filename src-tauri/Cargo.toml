[package]
name = "tauri-webgpu-mirc"
version = "0.0.0"
description = "A WebGPU mIRC-style TUI"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-alpha.12", features = [] }

[dependencies]
tauri = { version = "2.0.0-alpha.17", features = [] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
wgpu = "0.17"
raw-window-handle = "0.5"
pollster = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]